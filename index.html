<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food & Place Discovery</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body class="food-page">
    <!-- 顶部导航栏 -->
    <header id="header-section">
        <!-- 左边：logo -->
        <div class="logo">
            MyDiscovery
        </div>
        <!-- 中间：导航按钮 -->
        <nav class="tabs">
            <button id="tab-food">Food</button>
            <button id="tab-place">Place</button>
            <button id="tab-weather">Weather</button>
        </nav>
        <!-- 右边：搜索栏 -->
        <div class="search-container">
            <input 
                type="text" 
                placeholder="Search..."
                id="search-bar"
            >
        </div>
    </header>

    <div class="app-layout">
        <!-- 左侧筛选 -->
        <aside id="sidebar-section">
            <!-- 共用筛选 -->
             
            <div class="shared-filters">
                <!-- 正在开门 -->
                <div class="filter-group custom-fill-filter">
                    <input type="checkbox" id="Open-right-now">
                    <label for="Open-right-now">Open Now</label>
                </div>

                <div class="filter-group">
                    <!-- 价格滑动条 -->
                    <label for="cost-slider">Cost Range:</label>
                    <div class="price-display">
                        From$
                        <span id="min-value">0</span>
                        to $
                        <span id="max-value">>50</span>
                    </div>
                    <div class="range-slider-container">
                        <div class="slider-track"></div>
                        <input type="range" id="slider-min" min="0" max="50" value="0" step="1">
                        <input type="range" id="slider-max" min="1" max="50" value="50" step="1">
                    </div>
                </div>
                <div class="filter-group custom-fill-filter">
                    <!-- 减价 -->
                    <input type="checkbox" id="discount-only">
                    <label for="discount-only">
                        Discount Only
                    </label>
                </div>
                <button class="random-btn">
                    🎲 Pick For Me!
                </button>
            </div>

            <hr>
            <!-- 食物 -->
            <div class="food-exclusive">
                <div class="filter-group custom-fill-filter">
                    <input type="checkbox" id="full-meal">
                    <label for="full-meal">Full Meal🍱 </label>
                </div>
                <div class="filter-group custom-fill-filter">
                    <input type="checkbox" id="dessert">
                    <label for="dessert">Dessert 🍰</label>
                </div>
                <div class="filter-group custom-fill-filter">
                    <input type="checkbox" id="vegan">
                    <label for="vegan"> Vegan 🥗</label>
                </div>
                <div class="filter-group custom-fill-filter">
                    <input type="checkbox" id="good-for-study">
                    <label for="good-for-study">Study! 💻</label>
                </div>
                
            </div>
            
            <!-- 景点 -->
            <div class="place-exclusive">
                <div class="filter-group custom-fill-filter">
                    <input type="checkbox" id="nature">
                    <label for="nature">Nature & Parks </label>
                </div>

                <div class="filter-group custom-fill-filter">
                    <input type="checkbox" id="historic">
                    <label for="historic">Historic Landmarks </label>
                </div>

                <div class="filter-group custom-fill-filter">
                    <input type="checkbox" id="museums">
                    <label for="museums">Museums Galleries </label>
                </div>

                <div class="filter-group custom-fill-filter">
                    <input type="checkbox" id="hidden-gems">
                    <label for="hidden-gems">Hidden Gems </label>
                </div>
            </div>

        </aside>

        <!-- 主页/中间部分 -->
        <main id="main-section">
            <h2 id="page-title">Currently Browsing: Food</h2>
            <!-- 如果没理解错这个地方是全部删了 然后你自己重新设计卡片 -->
            <div class="results-container">
                <article class="location-card">
                    <div class="card-img">Image Placeholder</div>
                    <div class="card-info">
                        <h3>Sample Location Name</h3>
                        <p>Rating: ⭐⭐⭐⭐</p>
                        <span class="price-tag">$$</span>
                    </div>
                </article>
            </div>
        </main>
        </div>

    <script src="js/topbar.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
